# Recipe: switch_distill
# Switch distillation: partition tokens between CE and reverse KL by teacher
# entropy. L = (1-m_t)*lambda_ce*CE + m_t*T^2*KL(p_S||p_T). T=2.0, lambda_ce=1.0, gate_quantile=0.20.
name: dolmino-switch-distill-q20-lam1p0-28800steps
dump_dir: ${oc.env:MIDTRAIN_ROOT}/switch_distill
steps: 28800
probe_freq: null
seed: 777
grad_acc_steps: 4

optim:
  lr: 7.4487e-5
  weight_decay: 0.1
  warmup: 0
  lr_min_ratio: 0.0
  clip: 1.0
  beta1: 0.9
  beta2: 0.95
  scheduler: linear

distributed:
  fsdp_type: full_shard
  compile: true
  model_dtype: bf16
  matmul_allow_tf32: true
  selective_activation_checkpointing: false
  tp_size: 1

model:
  dim: 2048
  n_layers: 16
  n_heads: 16
  n_kv_heads: 16
  ffn_dim_multiplier: 1.5
  multiple_of: 256
  norm_eps: 1e-6
  rope_theta: 500000
  weight_tying: false
  qk_norm: true
  post_norm: true

checkpoint:
  init_ckpt_path: ${oc.env:STUDENT_INIT_PATH}
  dump:
    every: 1200
    keep: -1
  eval:
    every: 1200
    keep: -1

teacher_model_path: ${oc.env:TEACHER_PATH}

data:
  root_dir: ${oc.env:DATA_ROOT}
  batch_size: 8
  prefetch_size: 64
  seq_len: 4096
  n_views: 2
  load_async: true
  add_bos: true
  add_eos: true
  disable_cross_doc_attn: true
  sources:
    dclm_shuffled: 0.472
    math_shuffled: 0.208
    flan_shuffled: 0.166
    wiki_shuffled: 0.0711
    pes2o_shuffled: 0.0585
    stackexchange_shuffled: 0.0245
  tokenizer:
    name: hf
    path: ${oc.env:TOKENIZER_PATH}

  use_switch_distill: true
  switch_distill_temperature: 2.0
  switch_distill_lambda_ce: 1.0
  switch_distill_quantile: 0.20
  switch_distill_chunk_size: 128

profiling:
  run: false

logging:
  freq: 10
  wandb:
    project: "midtraining-distillation-dolmino-midtrain"
    entity: ${oc.env:WANDB_ENTITY,null}
    resume: allow

async_eval_gpus: 1
eval:
  dump_dir: ${oc.env:EVAL_ROOT}/slurm_eval_logs
  generator:
    max_tokens: 2048
    temperature: 0.0
    dtype: bf16
  olmes:
    tasks:
      - gsm8k::olmes
      - arc_challenge::olmes
      - hellaswag::olmes
      - mmlu::olmes
      - winogrande::olmes
      - truthfulqa
      - naturalqs::olmes
      - drop::olmes
      - mmlu_pro:mc::none
      - agi_eval_english:1shot::olmes
      - triviaqa::olmes
      - minerva_math_500::olmes
      - simpleqa::no-judge-short-form
    model_type: vllm
    tokenizer_path: ${oc.env:STUDENT_HF_PATH}
    tokenizer_revision: main
    max_length: 4096
    gpu_memory_utilization: 0.8
    trust_remote_code: true
    olmes_env: ${oc.env:OLMES_CONDA_ENV}
  validation:
    max_steps: 1000
    use_val_from_train_src: false
    root_dir: ${oc.env:DATA_ROOT}
    sources:
      - dolmino_val
